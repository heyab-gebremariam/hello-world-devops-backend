version: '3.8'

services:
  backend-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hello-world-backend-test
    ports:
      - "8091:8091"
    env_file:
      - .env # Load variables from .env file
    environment:
      DATABASE_URL: ${DATABASE_URL_TEST} # Read from .env file
      GIN_MODE: "debug"
      PORT: "8091"
    restart: unless-stopped # Optional: Restart policy
    networks: # Optional: Define network if coordinating with other services
      - test-network
    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:13-alpine 
    container_name: hello-world-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    networks:
      - test-network
    volumes:
      - test-db-data:/var/lib/postgresql/data
    healthcheck: # Optional but good practice
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5


networks: # Optional
  test-network:
    driver: bridge

volumes:
  test-db-data:
    driver: local
